      subgroup: ''
      subgroupDescription: ''
      title: 'Log out'
      description: 'Revokes the token used for this request.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses: []
    responseFields: []
    auth:
